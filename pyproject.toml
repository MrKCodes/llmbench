[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "llmbench"
version = "0.1.0"
description = "Benchmark local LLM inference across machines and backends, with a side-by-side report."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "requests>=2.28",
    "pyyaml>=6.0",
]

[project.scripts]
llmbench = "llmbench.cli:main"

[tool.setuptools]
packages = ["llmbench", "llmbench.backends"]
